# CI for MarkdownEditor — a Tauri v2 desktop app (Rust shell + JS editor).
#
# Two jobs:
# Computed only on PR + Release (not on every push, to save runner time).
#
#   1. test  — runs the full Node/Playwright verification suite on Ubuntu.
#              Fast feedback, no Rust. Runs on every PR and on release.
#   2. build — builds platform installers (one per OS) and attaches them to
#              a GitHub Release. Runs only after `test` is green AND only on
#              the `release.created` event (i.e. when you actually cut a release).
#              Skipped on PRs and plain pushes to main.
#
# How to cut a release: bump `version` in `src-tauri/tauri.conf.json`, commit
# & push, then create a Release at that exact `v<version>` tag (e.g. `v0.1.0`)
# via the Releases page. CI picks it up on `release.created`, tests, builds all
# three platforms, and attaches the installers to that release.

name: CI

# Triggered only on:
#   • pull_request  opened | synchronize | reopened | ready_for_review
#     (new PRs + every updated commit on the PR branch + a draft PR
#      becoming ready + a closed PR being reopened)
#   • release created
#     (you bump the version, cut the release, and CI builds &
#     attaches the installers to it)
#
# NOTE: not run on `push` to main, to save compute. To bump a version or
# cut a new release, open Settings → Releases and hit "Create a release"
# (or the Releases → Add a tag dialog).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [created]

# The build job's token must be able to create the release + upload assets.
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: Test (round-trip + Playwright UI + native-path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Playwright needs a browser. `--with-deps` pulls the system libs on the
      # Linux runner (WebKitGTK-style deps are irrelevant here — this is just
      # headless Chromium for the editor UI tests).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Cheap → expensive. Each Playwright script self-builds (npx vite build)
      # and serves its own preview on a dedicated port, so they run cleanly.
      - name: Round-trip invariant (21 cases)
        run: npm test
      - name: UI smoke test
        run: npm run verify
      - name: Undo/redo UI test (11 cases)
        run: npm run verify-undo
      - name: Save / open / close-guard UI test (24 cases)
        run: npm run verify-save
      - name: Toolbar active-states track the caret (18 cases)
        run: npm run verify-toolbar
      - name: Rich-paste HTML→Markdown (18 cases)
        run: npm run verify-paste
      - name: Export-as-PDF/HTML (30 cases)
        run: npm run verify-export
      - name: Scroll-sync lag fix (5 cases)
        run: npm run verify-scroll
      - name: Mode-switch scroll-preserving (8 cases)
        run: npm run verify-modescroll
      - name: Mode-click does not focus the editor (13 cases)
        run: npm run verify-modefocus
      - name: Redundant tab-click is a no-op (6 cases)
        run: npm run verify-tabclick
      - name: Cross-tab scroll persistence (7 cases)
        run: npm run verify-tabscroll
      - name: Native Tauri IPC path (43 cases)
        run: npm run verify-tauri

  # ----------------------------------------------------- build + release
  build:
    name: Build ${{ matrix.os }} + release
    needs: test
    # Build installers ONLY when a Release is cut (event `release.created`) —
    # not on PRs and not on plain pushes to main. That's the whole point of
    # the new trigger set: saves runner compute on every commit.
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "--bundles nsis,msi"
          - os: macos-14
            bundles: "--bundles dmg"
          - os: ubuntu-22.04
            bundles: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    concurrency:
      # Don't let parallel release-upload jobs collide on the same tag.
      group: release-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # OS-level build prerequisites (Tauri/WebKitGTK, WebView2, NSIS).
      # These are "why" comments: the base GitHub runners do NOT ship them.
      - name: Linux deps (WebKitGTK 4.1 + GTK3 + tray + rsvg)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Windows deps (NSIS for the installer)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y --no-progress

      - name: Build Tauri + publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # projectPath is the cwd for both tauri build AND beforeBuildCommand
          # (npm run build → vite build). It must be the repo root, NOT src-tauri,
          # because @tauri-apps/cli is installed in the root node_modules and
          # frontendDist in tauri.conf.json is "../dist" (root-relative).
          # tauri-action auto-discovers src-tauri/ by globbing for tauri.conf.json.
          projectPath: .
          # Run the CLI via npx so it resolves @tauri-apps/cli from the root
          # node_modules (installed above by `npm ci`). `tauri` is not on PATH.
          tauriScript: npx tauri
          args: ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: "Markdown Editor"
          releaseBody: |
            Cross-platform installers:

            - **Windows**: `*_x64-setup.exe` (NSIS) / `*_x64_en-US.msi`
            - **macOS**: `*_aarch64.dmg` (Apple Silicon)
            - **Linux**: `*_amd64.AppImage` / `*_amd64.deb`

            Built by GitHub Actions.
          # If the action ends up *creating* a new release (e.g. the user's
          # release tag didn't match `v<version>` and the action's
          # `tagName: v__VERSION__` lookup missed it), make it a draft so
          # we don't silently publish an unreleased build.
          releaseDraft: true
