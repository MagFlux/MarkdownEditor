# CI for MarkdownEditor — an Electron desktop app (Electron shell + Vite-built
# JS editor).
#
# Three jobs. Computed only on PR + Release (not on every push, to save runner
# time).
#
#   0. validate-tag — fail-fast gate on `release.created`: the tag must be
#              `vX.Y.Z` or `vX.Y.Z-N` (numeric N <= 65535). Text prereleases
#              like `-rc.1` feed the Windows MSI ProductVersion (WiX requires
#              numeric-only components), so we reject them in seconds before
#              `test`/`build` burn any runner time. No-op on PRs.
#   1. test  — runs the full Node/Playwright verification suite on Ubuntu.
#              Fast feedback, no Electron shell needed (the suites drive the
#              bundle + the shell-IPC wire contract). Runs on every PR and on
#              release.
#   2. build — builds the platform installers + portable packages with
#              electron-builder and attaches them to a GitHub Release. Runs
#              only after `test` is green AND only on the `release.created`
#              event (i.e. when you actually cut a release). Skipped on PRs
#              and plain pushes to main.
#
#              Per-OS targets (electron-builder.yml): Windows NSIS installer +
#              MSI (WiX) + portable stand-alone .exe; macOS .dmg + .zip (the
#              .app portable, Apple Silicon); Linux AppImage + .deb + tar.gz
#              portable. Unlike the old Tauri pipeline there is NO extra
#              re-packaging step: electron-builder's targets ARE the
#              installers and the portables, so the build step uploads its own
#              output directory directly.
#
#              Electron bundles the runtime (Chromium + Node), so no OS-level
#              GUI toolchain install is needed on any runner. The Linux
#              deb/AppImage ship their own runtime (users need only the
#              standard desktop libs); the tar.gz portable needs system
#              libraries like every Electron Linux unpack (documented in the
#              release body).
#
# Versioning: the git tag is the single source of truth (e.g. `v0.1.0`).
# The repo files keep a `0.0.0` placeholder (`package.json`); the build job
# injects the tag version into package.json before electron-builder runs so
# the bundled app/installers carry the tag. Never bump a version file by hand
# to cut a release — just cut the release. CI picks it up on
# `release.created`, tests, builds all three platforms, and attaches the
# installers + portables to that release.

name: CI

# Triggered only on:
#   • pull_request  opened | synchronize | reopened | ready_for_review
#     (new PRs + every updated commit on the PR branch + a draft PR
#      becoming ready + a closed PR being reopened)
#   • release created
#     (you cut a release at a `v<version>` tag and CI builds &
#     attaches the installers to it — the tag is the version)
#
# NOTE: not run on `push` to main, to save compute. To cut a new release,
# open Settings → Releases and hit "Create a release" (or
# `git tag vX.Y.Z && git push --tags`).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [created]

# The build job's token must be able to create the release + upload assets.
permissions:
  contents: write

jobs:
  # --------------------------------------------- fail-fast tag gate (release)
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag is MSI-compatible semver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "Not a release event — skipping tag check."
            exit 0
          fi
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"
          # Allowed: vX.Y.Z or vX.Y.Z-N with numeric N (the Windows MSI's
          # ProductVersion only accepts numeric components <= 65535, so fail
          # here in seconds instead of after the electron-builder step).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Use vX.Y.Z (e.g. v0.1.4) or vX.Y.Z-N with numeric N <= 65535 (e.g. v0.1.4-1). Text prereleases like -rc.1 fail the Windows MSI build (WiX requires numeric-only version components)."
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="${TAG#*-}"
            if [ "$PRE" -gt 65535 ]; then
              echo "::error::Prerelease number $PRE exceeds MSI limit 65535."
              exit 1
            fi
          fi
          echo "Tag OK: $TAG"

  # ------------------------------------------------------------------ tests
  test:
    name: Test (round-trip + Playwright UI + shell-IPC path)
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The test suites never launch Electron (they drive the built bundle in
      # headless Chromium and stub the shell-IPC bridge), so skip the ~150 MB
      # electron binary download that the package's postinstall would pull.
      - name: npm ci (skip Electron binary — tests don't need it)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Playwright needs a browser. `--with-deps` pulls the system libs on the
      # Linux runner (just headless Chromium for the editor UI tests).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Cheap → expensive. Each Playwright script self-builds (npx vite build)
      # and serves its own preview on a dedicated port, so they run cleanly.
      - name: Round-trip invariant (Node)
        run: npm test
      - name: UI smoke test
        run: npm run verify
      - name: Undo/redo UI test (11 cases)
        run: npm run verify-undo
      - name: Save / open / close-guard UI test (24 cases)
        run: npm run verify-save
      - name: Toolbar active-states track the caret (56 cases)
        run: npm run verify-toolbar
      - name: Rich-paste HTML→Markdown (18 cases)
        run: npm run verify-paste
      - name: Export-as-PDF/HTML (30 cases)
        run: npm run verify-export
      - name: Math (KaTeX) preview + export (21 cases)
        run: npm run verify-math
      - name: Scroll-sync lag fix (5 cases)
        run: npm run verify-scroll
      - name: Dialog scroll preservation (30 cases)
        run: npm run verify-dialogscroll
      - name: Block-anchored scroll sync (17 cases)
        run: npm run verify-scrollsync
      - name: Mode-switch scroll-preserving (8 cases)
        run: npm run verify-modescroll
      - name: Mode-click does not focus the editor (13 cases)
        run: npm run verify-modefocus
      - name: Redundant tab-click is a no-op (10 cases)
        run: npm run verify-tabclick
      - name: Cross-tab scroll persistence (7 cases)
        run: npm run verify-tabscroll
      - name: Theme-switch scroll + themed scrollbars (10 cases)
        run: npm run verify-themescroll
      - name: Mermaid anti-flicker (7 cases)
        run: npm run verify-mermaidflicker
      - name: Mermaid stylesheet-failure robustness (38 cases)
        run: npm run verify-mermaidstyle
      - name: Mermaid dark-theme gradient-outline fade (16 cases)
        run: npm run verify-mermaidfade
      - name: Caret placement after editor actions (92 cases)
        run: npm run verify-caret
      - name: Find & Replace bar (38 cases)
        run: npm run verify-find
      - name: GFM task lists (12 cases)
        run: npm run verify-tasks
      - name: Recent files menu (12 cases)
        run: npm run verify-recent
      - name: Fenced-code highlighting (7 cases)
        run: npm run verify-codecolor
      - name: Shell-IPC native path (Electron wire contract) (55 cases)
        run: npm run verify-tauri

  # ----------------------------------------------------- build + release
  build:
    name: Build ${{ matrix.os }} + release
    needs: [validate-tag, test]
    # Build installers ONLY when a Release is cut (event `release.created`) —
    # not on PRs and not on plain pushes to main — to save runner compute.
    # The release tag (e.g. `v0.1.0`) is the version — injected below.
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    concurrency:
      # Don't let parallel release-upload jobs collide on the same tag.
      group: release-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Tag is the version: `vX.Y.Z` → `X.Y.Z` into package.json so the
      # built app/installers carry the release tag. Repo files stay `0.0.0`.
      # Pure node (no sed) so it runs identically on every runner.
      - name: Inject tag version into package.json
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          if [ -z "$VER" ]; then echo "No release tag found"; exit 1; fi
          echo "Injecting version $VER from tag $TAG"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n');" "$VER"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          grep '"version"' package.json

      # Builds the current platform's targets from electron-builder.yml:
      #   windows-latest → NSIS installer, MSI (WiX), portable .exe
      #   macos-14       → .dmg + .zip (portable .app, Apple Silicon)
      #   ubuntu-22.04   → AppImage, .deb, tar.gz portable
      # No OS-level package installs are needed: electron-builder fetches
      # NSIS/WiX on Windows itself, and Electron ships its own runtime.
      # electronDist in the config reuses node_modules/electron/dist (already
      # installed by npm ci) instead of re-downloading Electron.
      - name: Build installers + portables (electron-builder)
        shell: bash
        run: npx electron-builder --publish never

      # Upload the artifacts straight from electron-builder's output dir
      # (release/) to the release this job was triggered by — the tag already
      # exists, so `gh release upload --clobber` attaches to it. (The blockmap
      # sidecar files Electron Builder writes alongside NSIS/Exe/Zip are
      # updater internals — intentionally NOT uploaded.)
      - name: Upload installers + portables to release (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          for f in release/*.exe release/*.msi; do files+=("$f"); done
          echo "Uploading: ${files[*]}"
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

      - name: Upload installers + portables to release (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          for f in release/*.dmg release/*.zip; do files+=("$f"); done
          echo "Uploading: ${files[*]}"
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber

      - name: Upload installers + portables to release (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=()
          for f in release/*.AppImage release/*.deb release/*.tar.gz; do files+=("$f"); done
          echo "Uploading: ${files[*]}"
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
