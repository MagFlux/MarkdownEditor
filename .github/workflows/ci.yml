# CI for MarkdownEditor — a Tauri v2 desktop app (Rust shell + JS editor).
#
# Three jobs:
# Computed only on PR + Release (not on every push, to save runner time).
#
#   0. validate-tag — fail-fast gate on `release.created`: the tag must be
#              `vX.Y.Z` or `vX.Y.Z-N` (numeric N <= 65535). Text prereleases
#              like `-rc.1` fail the Windows MSI bundle (WiX requires
#              numeric-only prerelease), so we reject them in seconds before
#              `test`/`build` burn any runner time. No-op on PRs.
#   1. test  — runs the full Node/Playwright verification suite on Ubuntu.
#              Fast feedback, no Rust. Runs on every PR and on release.
#   2. build — builds platform installers + portable standalone archives
#              (one per OS) and attaches them to
#              a GitHub Release. Runs only after `test` is green AND only on
#              the `release.created` event (i.e. when you actually cut a release).
#              Skipped on PRs and plain pushes to main.
#
#              Installers come from `tauri-action` (`--bundles ...` per OS).
#              Portables are packaged from the already-built output in a
#              follow-up step (no extra compile): Windows zips the raw
#              `markdown-editor.exe`, Linux tar.gz's the raw `markdown-editor`
#              binary (AppImage remains the most portable Linux option — the
#              raw binary still needs system WebKitGTK), macOS mounts the
#              `.dmg` and zips the `.app` out of it via `ditto` (the dmg
#              build leaves no loose .app on disk). Each archive is then
#              uploaded to the same release with `gh release upload`.
#
# Versioning: the git tag is the single source of truth (e.g. `v0.1.0`).
# The repo files keep a `0.0.0` placeholder (`src-tauri/tauri.conf.json`,
# `src-tauri/Cargo.toml`); the build job injects the tag version into both
# files before `tauri build` so the bundled app/installers carry the tag.
# Never bump a version file by hand to cut a release — just cut the release.
# CI picks it up on `release.created`, tests, builds all three platforms,
# and attaches the installers + portables to that release.

name: CI

# Triggered only on:
#   • pull_request  opened | synchronize | reopened | ready_for_review
#     (new PRs + every updated commit on the PR branch + a draft PR
#      becoming ready + a closed PR being reopened)
#   • release created
#     (you cut a release at a `v<version>` tag and CI builds &
#     attaches the installers to it — the tag is the version)
#
# NOTE: not run on `push` to main, to save compute. To cut a new release,
# open Settings → Releases and hit "Create a release" (or
# `git tag vX.Y.Z && git push --tags`).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [created]

# The build job's token must be able to create the release + upload assets.
permissions:
  contents: write

jobs:
  # --------------------------------------------- fail-fast tag gate (release)
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check tag is MSI-compatible semver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "release" ]; then
            echo "Not a release event — skipping tag check."
            exit 0
          fi
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag: $TAG"
          # Allowed: vX.Y.Z or vX.Y.Z-N with numeric N (MSI/WiX rejects
          # non-numeric prereleases like -rc.1, so fail here in seconds
          # instead of after the 5-minute Windows compile).
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Invalid release tag '$TAG'. Use vX.Y.Z (e.g. v0.1.4) or vX.Y.Z-N with numeric N <= 65535 (e.g. v0.1.4-1). Text prereleases like -rc.1 fail the Windows MSI build (WiX requires numeric-only prerelease <= 65535)."
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            PRE="${TAG#*-}"
            if [ "$PRE" -gt 65535 ]; then
              echo "::error::Prerelease number $PRE exceeds MSI limit 65535."
              exit 1
            fi
          fi
          echo "Tag OK: $TAG"

  # ------------------------------------------------------------------ tests
  test:
    name: Test (round-trip + Playwright UI + native-path)
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Playwright needs a browser. `--with-deps` pulls the system libs on the
      # Linux runner (WebKitGTK-style deps are irrelevant here — this is just
      # headless Chromium for the editor UI tests).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Cheap → expensive. Each Playwright script self-builds (npx vite build)
      # and serves its own preview on a dedicated port, so they run cleanly.
      - name: Round-trip invariant (21 cases)
        run: npm test
      - name: UI smoke test
        run: npm run verify
      - name: Undo/redo UI test (11 cases)
        run: npm run verify-undo
      - name: Save / open / close-guard UI test (24 cases)
        run: npm run verify-save
      - name: Toolbar active-states track the caret (18 cases)
        run: npm run verify-toolbar
      - name: Rich-paste HTML→Markdown (18 cases)
        run: npm run verify-paste
      - name: Export-as-PDF/HTML (30 cases)
        run: npm run verify-export
      - name: Scroll-sync lag fix (5 cases)
        run: npm run verify-scroll
      - name: Mode-switch scroll-preserving (8 cases)
        run: npm run verify-modescroll
      - name: Mode-click does not focus the editor (13 cases)
        run: npm run verify-modefocus
      - name: Redundant tab-click is a no-op (6 cases)
        run: npm run verify-tabclick
      - name: Cross-tab scroll persistence (7 cases)
        run: npm run verify-tabscroll
      - name: Mermaid anti-flicker (7 cases)
        run: npm run verify-mermaidflicker
      - name: Mermaid stylesheet-failure robustness (8 cases)
        run: npm run verify-mermaidstyle
      - name: Caret placement after editor actions (71 cases)
        run: npm run verify-caret
      - name: Native Tauri IPC path (43 cases)
        run: npm run verify-tauri

  # ----------------------------------------------------- build + release
  build:
    name: Build ${{ matrix.os }} + release
    needs: [validate-tag, test]
    # Build installers ONLY when a Release is cut (event `release.created`) —
    # not on PRs and not on plain pushes to main. That's the whole point of
    # the new trigger set: saves runner compute on every commit.
    # The release tag (e.g. `v0.1.0`) is the version — injected below.
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "--bundles nsis,msi"
          - os: macos-14
            bundles: "--bundles dmg"
          - os: ubuntu-22.04
            bundles: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    concurrency:
      # Don't let parallel release-upload jobs collide on the same tag.
      group: release-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # OS-level build prerequisites (Tauri/WebKitGTK, WebView2, NSIS).
      # These are "why" comments: the base GitHub runners do NOT ship them.
      - name: Linux deps (WebKitGTK 4.1 + GTK3 + tray + rsvg)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Windows deps (NSIS for the installer)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y --no-progress

      # Tag is the version: `vX.Y.Z` → `X.Y.Z` into both manifests so the
      # built app/installers carry the release tag. Repo files stay `0.0.0`.
      # Pure node (no sed) so it runs on ubuntu/macos/windows bash alike.
      - name: Inject tag version into Tauri/Cargo manifests
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          if [ -z "$VER" ]; then echo "No release tag found"; exit 1; fi
          echo "Injecting version $VER from tag $TAG"
          node -e "const fs=require('fs');const ver=process.argv[1];const cf='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(cf,'utf8'));j.version=ver;fs.writeFileSync(cf,JSON.stringify(j,null,2)+'\n');const tf='src-tauri/Cargo.toml';let t=fs.readFileSync(tf,'utf8');t=t.replace(/^version = \".*\"/m,'version = \"'+ver+'\"');fs.writeFileSync(tf,t);" "$VER"
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          grep '"version"' src-tauri/tauri.conf.json
          head -5 src-tauri/Cargo.toml

      - name: Build Tauri + publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # projectPath is the cwd for both tauri build AND beforeBuildCommand
          # (npm run build → vite build). It must be the repo root, NOT src-tauri,
          # because @tauri-apps/cli is installed in the root node_modules and
          # frontendDist in tauri.conf.json is "../dist" (root-relative).
          # tauri-action auto-discovers src-tauri/ by globbing for tauri.conf.json.
          projectPath: .
          # Run the CLI via npx so it resolves @tauri-apps/cli from the root
          # node_modules (installed above by `npm ci`). `tauri` is not on PATH.
          tauriScript: npx tauri
          args: ${{ matrix.bundles }}
          # Tag already exists (we run on `release.created`) — upload here.
          tagName: ${{ github.event.release.tag_name }}
          releaseName: "Markdown Editor"
          releaseBody: |
            Cross-platform installers + portable standalones:

            - **Windows**: `*_x64-setup.exe` (NSIS) / `*_x64_en-US.msi` / `*-windows-x64-portable.zip` (standalone `.exe`, no install)
            - **macOS**: `*_aarch64.dmg` (Apple Silicon) / `*-macos-aarch64-portable.zip` (standalone `.app`, no install)
            - **Linux**: `*_amd64.AppImage` / `*_amd64.deb` / `*-linux-x86_64-portable.tar.gz` (standalone binary — needs system WebKitGTK)

            Built by GitHub Actions.
          # If the action ends up *creating* a new release (should not happen
          # on `release.created`), keep it a draft so we don't silently
          # publish an unreleased build.
          releaseDraft: true

      # Portable standalones: re-package the already-built output from the
      # step above (no extra compile). Each OS zips/tars its raw binary and
      # uploads it to the SAME release via `gh release upload`.
      # Caveats (documented in the release body + README):
      # - Linux raw binary still needs system WebKitGTK/GTK — the AppImage
      #   remains the most portable Linux option.
      # - macOS/Windows portables are unsigned (Gatekeeper/SmartScreen warn).
      - name: Package Windows portable (standalone .exe .zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          if (-not $ver) { $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version }
          $zip = "markdown-editor-$ver-windows-x64-portable.zip"
          Compress-Archive -Path src-tauri/target/release/markdown-editor.exe -DestinationPath $zip -Force
          echo "PORTABLE_ARCHIVE=$zip" >> $env:GITHUB_ENV

      - name: Package Linux portable (standalone binary .tar.gz)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          VER="${APP_VERSION:-$(node -p "require('./src-tauri/tauri.conf.json').version")}"
          ARCHIVE="markdown-editor-$VER-linux-x86_64-portable.tar.gz"
          tar -czf "$ARCHIVE" -C src-tauri/target/release markdown-editor
          echo "PORTABLE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package macOS portable (standalone .app .zip)
        if: matrix.os == 'macos-14'
        run: |
          VER="${APP_VERSION:-$(node -p "require('./src-tauri/tauri.conf.json').version")}"
          ARCHIVE="Markdown-Editor-$VER-macos-aarch64-portable.zip"
          echo "Bundle layout:"
          find src-tauri/target/release/bundle -maxdepth 3 -print || true
          # `--bundles dmg` leaves only the .dmg (no loose .app on disk),
          # so mount the dmg and copy the .app out of it. Don't hardcode the
          # .app name (productName has a space and may change) — pick
          # whatever *.app the dmg contains.
          DMG=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" -print -quit)
          if [ -z "$DMG" ]; then
            echo "No .dmg found under src-tauri/target/release/bundle/dmg"
            exit 1
          fi
          echo "Found dmg: $DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MNT"
          APP=$(find "$MNT" -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found inside $DMG"
            hdiutil detach "$MNT" || true
            exit 1
          fi
          echo "Found app: $APP"
          cp -R "$APP" ./portable-app-tmp
          hdiutil detach "$MNT"
          # ditto preserves .app resource forks / quarantine attrs where zip would not.
          ditto -c -k --sequesterRsrc --keepParent ./portable-app-tmp "$ARCHIVE"
          rm -rf ./portable-app-tmp
          echo "PORTABLE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload portable to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$PORTABLE_ARCHIVE" --clobber
